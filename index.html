<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OmniHub — Sinema, Dizi & Canlı TV</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniHub" />

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg: #0b0b0f;
            --surface: #14141c;
            --surface-2: #1f1f2b;
            --accent: #e50914;
            --text: #ffffff;
            --muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-bottom: 76px;
            overflow-x: hidden;
        }

        /* Sade ve Şık Üst Bar */
        header {
            position: sticky;
            top: 0;
            z-index: 90;
            background: rgba(11, 11, 15, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo {
            font-size: 19px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .logo span {
            background: var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        .search-wrap {
            flex: 1;
            max-width: 340px;
        }

        .search-wrap input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }

        .search-wrap input:focus {
            border-color: var(--accent);
        }

        /* Alt Menü (Mobil & Masaüstü Ortak Temiz Bar) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 90;
            background: rgba(15, 15, 22, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 16px;
        }

        .nav-item .ico {
            font-size: 19px;
        }

        .nav-item.active {
            color: var(--accent);
        }

        /* Kategori Çubuğu */
        .chips-row {
            display: flex;
            gap: 8px;
            padding: 12px 16px 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .chips-row::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--surface-2);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* İçerik Izgarası */
        .container {
            padding: 12px 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
            gap: 12px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
                gap: 16px;
            }
        }

        .card {
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card-poster {
            position: relative;
            aspect-ratio: 2 / 3;
            background: #1a1a24;
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-rating {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.82);
            color: #fbbf24;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .card-body {
            padding: 8px;
        }

        .card-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-year {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Canlı TV */
        .tv-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 900px) {
            .tv-grid {
                grid-template-columns: 1.4fr 1fr;
            }
        }

        .tv-player-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-box video {
            width: 100%;
            height: 100%;
        }

        .tv-bar {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .channels-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 8px;
        }

        .ch-item {
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-align: left;
        }

        .ch-item.active {
            border-color: var(--accent);
            background: rgba(229, 9, 20, 0.18);
        }

        .ch-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            flex-shrink: 0;
        }

        .ch-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ch-sub {
            font-size: 10px;
            color: #10b981;
        }

        /* Sade ve Temiz Oynatıcı Modalı */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: var(--bg);
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .modal.open {
            display: flex;
        }

        .modal-header {
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .close-btn {
            background: var(--surface-2);
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .servers-row {
            display: flex;
            gap: 6px;
            padding: 10px 16px;
            background: #101016;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid var(--border);
        }
        .servers-row::-webkit-scrollbar { display: none; }

        .srv-btn {
            background: var(--surface-2);
            color: #d1d5db;
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .srv-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .player-frame-box {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .player-frame-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .episodes-section {
            padding: 14px 16px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }

        .ep-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .ep-card {
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 10px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
        }

        .ep-card.active {
            border-color: var(--accent);
            background: rgba(229, 9, 20, 0.2);
        }

        .ep-card .num {
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
        }

        .ep-card .name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showTab('movies')">
            <span>▶</span> OmniHub
        </div>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Film veya dizi ara..." oninput="onSearch(this.value)" />
        </div>
    </header>

    <!-- 1. FİLMLER SEKMESİ -->
    <div id="view-movies" class="tab-view">
        <div class="chips-row">
            <button class="chip active" onclick="loadMovies('top', '', this)">🔥 Popüler</button>
            <button class="chip" onclick="loadMovies('imdbRating', '', this)">⭐ En İyiler</button>
            <button class="chip" onclick="loadMovies('top', 'Action', this)">💥 Aksiyon</button>
            <button class="chip" onclick="loadMovies('top', 'Sci-Fi', this)">🚀 Bilim Kurgu</button>
            <button class="chip" onclick="loadMovies('top', 'Comedy', this)">😂 Komedi</button>
            <button class="chip" onclick="loadMovies('top', 'Horror', this)">👻 Korku</button>
            <button class="chip" onclick="loadMovies('top', 'Thriller', this)">🔪 Gerilim</button>
        </div>
        <div class="container">
            <div class="grid" id="moviesGrid"></div>
        </div>
    </div>

    <!-- 2. DİZİLER SEKMESİ -->
    <div id="view-series" class="tab-view" style="display: none;">
        <div class="chips-row">
            <button class="chip active" onclick="loadSeries('ALL', this)">🔥 Popüler Diziler</button>
            <button class="chip" onclick="loadSeries('Drama', this)">🎭 Dram</button>
            <button class="chip" onclick="loadSeries('Action', this)">💥 Aksiyon</button>
            <button class="chip" onclick="loadSeries('Science-Fiction', this)">🚀 Bilim Kurgu</button>
            <button class="chip" onclick="loadSeries('Crime', this)">🕵️ Suç</button>
            <button class="chip" onclick="loadSeries('Comedy', this)">😂 Komedi</button>
        </div>
        <div class="container">
            <div class="grid" id="seriesGrid"></div>
        </div>
    </div>

    <!-- 3. CANLI TV SEKMESİ -->
    <div id="view-tv" class="tab-view" style="display: none;">
        <div class="chips-row">
            <button class="chip active" onclick="filterTv('ALL', this)">Tümü</button>
            <button class="chip" onclick="filterTv('Ulusal', this)">📺 Ulusal</button>
            <button class="chip" onclick="filterTv('Haber', this)">📰 Haber</button>
            <button class="chip" onclick="filterTv('Spor', this)">⚽ Spor</button>
            <button class="chip" onclick="filterTv('Müzik', this)">🎵 Müzik & Çocuk</button>
        </div>
        <div class="container">
            <div class="tv-grid">
                <div class="tv-player-card">
                    <div class="video-box">
                        <video id="tvVideo" controls playsinline autoplay></video>
                    </div>
                    <div class="tv-bar">
                        <div>
                            <div style="font-size: 14px; font-weight: 700;" id="tvTitle">Kanal Seçin</div>
                            <div style="font-size: 11px; color: #10b981;" id="tvGroup">Canlı Yayın</div>
                        </div>
                        <button class="chip" onclick="toggleTvPiP()">📺 PiP</button>
                    </div>
                </div>
                <div class="channels-list" id="tvList"></div>
            </div>
        </div>
    </div>

    <!-- ARAMA SONUÇLARI -->
    <div id="view-search" class="tab-view" style="display: none;">
        <div class="container">
            <div class="section-title" id="searchTitle">Arama Sonuçları</div>
            <div class="grid" id="searchGrid"></div>
        </div>
    </div>

    <!-- ALT MENÜ -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="movies" onclick="showTab('movies')">
            <span class="ico">🎬</span><span>Filmler</span>
        </button>
        <button class="nav-item" data-tab="series" onclick="showTab('series')">
            <span class="ico">📺</span><span>Diziler</span>
        </button>
        <button class="nav-item" data-tab="tv" onclick="showTab('tv')">
            <span class="ico">📡</span><span>Canlı TV</span>
        </button>
    </nav>

    <!-- SADE OYNATICI MODALI -->
    <div class="modal" id="playerModal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Başlık</div>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div class="servers-row">
            <button class="srv-btn active" onclick="setServer(0, this)">⚡ Kaynak 1 (VidSrc CC)</button>
            <button class="srv-btn" onclick="setServer(1, this)">🚀 Kaynak 2 (VidLink Pro)</button>
            <button class="srv-btn" onclick="setServer(2, this)">🇹🇷 Kaynak 3 (VidSrc XYZ)</button>
            <button class="srv-btn" onclick="setServer(3, this)">🎬 Kaynak 4 (MultiEmbed)</button>
            <button class="srv-btn" onclick="setServer(4, this)">🔥 Kaynak 5 (AutoEmbed)</button>
        </div>

        <div class="player-frame-box">
            <iframe id="playerIframe" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        </div>

        <div class="episodes-section" id="episodesBox" style="display: none;">
            <div class="chips-row" id="seasonsRow" style="padding: 0 0 8px 0;"></div>
            <div class="ep-list" id="episodesList"></div>
        </div>
    </div>

            { name: 'HT Spor HD', group: 'Spor', url: 'https://ciner.daioncdn.net/ht-spor/ht-spor.m3u8?app=web' },
            { name: 'Kral Pop TV', group: 'Müzik', url: 'https://dogus-live.daioncdn.net/kralpoptv/playlist.m3u8' },
            { name: 'Minika GO', group: 'Müzik', url: 'https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/minikago/minikago.m3u8' },
            { name: 'Minika Çocuk', group: 'Müzik', url: 'https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/minikago_cocuk/minikago_cocuk.m3u8' }
        ];

        let seriesCache = [];
        let hls = null;
        let state = {
            id: '',
            tvmazeId: null,
            type: 'movie',
            name: '',
            season: 1,
            episode: 1,
            server: 0,
            trSubUrl: '',
            episodes: []
        };

        window.addEventListener('DOMContentLoaded', () => {
            renderGrid('moviesGrid', DEFAULT_MOVIES, 'movie');
            loadMovies('top', '');
            initSeries();
            filterTv('ALL');
        });

        function showTab(tab) {
            document.querySelectorAll('.tab-view').forEach(v => v.style.display = 'none');
            document.getElementById('view-' + tab).style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            window.scrollTo(0, 0);
        }

        async function loadMovies(catalog, genre, btn) {
            if (btn) {
                btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }
            try {
                let url = `${CINEMETA}/catalog/movie/${catalog}.json`;
                if (genre) url = `${CINEMETA}/catalog/movie/${catalog}/genre=${encodeURIComponent(genre)}.json`;
                const res = await fetch(url).then(r => r.json());
                if (res.metas && res.metas.length > 0) {
                    renderGrid('moviesGrid', res.metas.slice(0, 48), 'movie');
                }
            } catch {
                renderGrid('moviesGrid', DEFAULT_MOVIES, 'movie');
            }
        }

        async function initSeries() {
            try {
                const shows = await fetch('https://api.tvmaze.com/shows?page=0').then(r => r.json());
                seriesCache = shows
                    .filter(s => s.externals && s.externals.imdb)
                    .sort((a, b) => (b.rating?.average || 0) - (a.rating?.average || 0))
                    .map(s => ({
                        id: s.externals.imdb,
                        tvmazeId: s.id,
                        type: 'series',
                        name: s.name,
                        poster: s.image?.medium || s.image?.original || '',
                        releaseInfo: (s.premiered || '').substring(0, 4),
                        imdbRating: s.rating?.average || '',
                        genres: s.genres || []
                    }));
                renderGrid('seriesGrid', seriesCache.slice(0, 48), 'series');
            } catch {}
        }

        function loadSeries(genre, btn) {
            if (btn) {
                btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }
            const filtered = genre === 'ALL' ? seriesCache.slice(0, 48) : seriesCache.filter(s => s.genres.includes(genre));
            renderGrid('seriesGrid', filtered, 'series');
        }

        let searchTimer = null;
        function onSearch(q) {
            clearTimeout(searchTimer);
            const text = q.trim();
            if (text.length < 2) return;

            searchTimer = setTimeout(async () => {
                showTab('search');
                document.getElementById('searchTitle').textContent = `"${text}" Sonuçları`;
                const items = [];

                try {
                    const [m, s] = await Promise.all([
                        fetch(`${CINEMETA}/catalog/movie/top/search=${encodeURIComponent(text)}.json`).then(r => r.json()),
                        fetch(`${CINEMETA}/catalog/series/top/search=${encodeURIComponent(text)}.json`).then(r => r.json())
                    ]);
                    (m.metas || []).forEach(x => items.push({ ...x, type: 'movie' }));
                    (s.metas || []).forEach(x => items.push({ ...x, type: 'series' }));
                } catch {}

                try {
                    const tv = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(text)}`).then(r => r.json());
                    tv.forEach(e => {
                        const s = e.show;
                        if (s?.externals?.imdb && !items.some(i => i.id === s.externals.imdb)) {
                            items.push({
                                id: s.externals.imdb,
                                tvmazeId: s.id,
                                type: 'series',
                                name: s.name,
                                poster: s.image?.medium || '',
                                releaseInfo: (s.premiered || '').substring(0, 4),
                                imdbRating: s.rating?.average || ''
                            });
                        }
                    });
                } catch {}

                renderGrid('searchGrid', items, 'movie');
            }, 350);
        }

        function renderGrid(id, list, fallbackType) {
            const box = document.getElementById(id);
            box.innerHTML = '';
            list.forEach(item => {
                const type = item.type || fallbackType;
                const poster = item.poster || `https://images.metahub.space/poster/medium/${item.id}/img`;
                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openPlayer(item.id, type, item.name, item.tvmazeId);
                div.innerHTML = `
                    <div class="card-poster">
                        <img src="${poster}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/14141c/666?text=Poster'" />
                        ${item.imdbRating ? `<span class="card-rating">⭐ ${item.imdbRating}</span>` : ''}
                    </div>
                    <div class="card-body">
                        <div class="card-name">${item.name}</div>
                        <div class="card-year">${item.releaseInfo || ''}</div>
                    </div>
                `;
                box.appendChild(div);
            });
        }

        // Oynatıcı
        async function openPlayer(id, type, name, tvmazeId) {
            state = { id, tvmazeId, type, name, season: 1, episode: 1, server: 0, trSubUrl: '', episodes: [] };
            document.getElementById('playerModal').classList.add('open');
            document.getElementById('modalTitle').textContent = name;
            document.querySelectorAll('.srv-btn').forEach((b, i) => b.classList.toggle('active', i === 0));

            if (type === 'series') {
                document.getElementById('episodesBox').style.display = 'block';
                fetchEpisodes(id, tvmazeId);
            } else {
                document.getElementById('episodesBox').style.display = 'none';
            }

            // Önce Stremio OpenSubtitles'tan Türkçe altyazı linkini al, sonra oynatıcıyı başlat
            await fetchTrSub();
            refreshIframe();
        }

        async function fetchTrSub() {
            state.trSubUrl = '';
            try {
                const q = state.type === 'series' ? `${state.id}:${state.season}:${state.episode}` : state.id;
                const res = await fetch(`${OPENSUBS}/subtitles/${state.type}/${q}.json`).then(r => r.json());
                const tr = (res.subtitles || []).find(s => s.lang === 'tur' || s.lang === 'tr');
                if (tr && tr.url) state.trSubUrl = tr.url;
            } catch {}
        }

        function refreshIframe() {
            const { id, type, season, episode, server, trSubUrl } = state;
            const subQuery = trSubUrl ? `&sub_file=${encodeURIComponent(trSubUrl)}&sub_label=Turkce&sub.file=${encodeURIComponent(trSubUrl)}&sub.label=Turkce` : '';

            let url = '';
            if (type === 'movie') {
                if (server === 0) url = `https://vidsrc.cc/v2/embed/movie/${id}?autoPlay=true`;
                else if (server === 1) url = `https://vidlink.pro/movie/${id}?autoplay=true${subQuery}`;
                else if (server === 2) url = `https://vidsrc.xyz/embed/movie/${id}?ds_lang=tr${subQuery}`;
                else if (server === 3) url = `https://multiembed.mov/?video_id=${id}`;
                else if (server === 4) url = `https://autoembed.co/movie/imdb/${id}`;
            } else {
                if (server === 0) url = `https://vidsrc.cc/v2/embed/tv/${id}/${season}/${episode}?autoPlay=true`;
                else if (server === 1) url = `https://vidlink.pro/tv/${id}/${season}/${episode}?autoplay=true${subQuery}`;
                else if (server === 2) url = `https://vidsrc.xyz/embed/tv/${id}/${season}-${episode}?ds_lang=tr${subQuery}`;
                else if (server === 3) url = `https://multiembed.mov/?video_id=${id}&s=${season}&e=${episode}`;
                else if (server === 4) url = `https://autoembed.co/tv/imdb/${id}-${season}-${episode}`;
            }

            document.getElementById('playerIframe').src = url;
        }

        function setServer(idx, btn) {
            state.server = idx;
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            refreshIframe();
        }

        async function fetchEpisodes(imdbId, tvmazeId) {
            const sRow = document.getElementById('seasonsRow');
            const eList = document.getElementById('episodesList');
            sRow.innerHTML = '';
            eList.innerHTML = '';

            try {
                let showId = tvmazeId;
                if (!showId) {
                    const info = await fetch(`https://api.tvmaze.com/lookup/shows?imdb=${imdbId}`).then(r => r.json());
                    showId = info.id;
                }
                if (showId) {
                    const eps = await fetch(`https://api.tvmaze.com/shows/${showId}/episodes`).then(r => r.json());
                    state.episodes = eps.map(e => ({ season: e.season, episode: e.number, name: e.name }));
                    renderEpisodesUI();
                }
            } catch {}
        }

        function renderEpisodesUI() {
            const sRow = document.getElementById('seasonsRow');
            const eList = document.getElementById('episodesList');
            sRow.innerHTML = '';
            eList.innerHTML = '';

            const seasons = [...new Set(state.episodes.map(e => e.season))].filter(Boolean);
            seasons.forEach(s => {
                const b = document.createElement('button');
                b.className = 'chip' + (s === state.season ? ' active' : '');
                b.textContent = `${s}. Sezon`;
                b.onclick = () => {
                    state.season = s;
                    renderEpisodesUI();
                };
                sRow.appendChild(b);
            });

            state.episodes.filter(e => e.season === state.season).forEach(ep => {
                const b = document.createElement('button');
                b.className = 'ep-card' + (ep.episode === state.episode ? ' active' : '');
                b.innerHTML = `<div class="num">${ep.episode}. Bölüm</div><div class="name">${ep.name || ''}</div>`;
                b.onclick = async () => {
                    state.episode = ep.episode;
                    renderEpisodesUI();
                    await fetchTrSub();
                    refreshIframe();
                };
                eList.appendChild(b);
            });
        }

        function closeModal() {
            document.getElementById('playerModal').classList.remove('open');
            document.getElementById('playerIframe').src = 'about:blank';
        }

        // Canlı TV
        function filterTv(cat, btn) {
            if (btn) {
                btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }
            const list = document.getElementById('tvList');
            list.innerHTML = '';
            const items = cat === 'ALL' ? TV_CHANNELS : TV_CHANNELS.filter(c => c.group === cat);

            items.forEach(ch => {
                const b = document.createElement('button');
                b.className = 'ch-item';
                b.innerHTML = `
                    <div class="ch-icon">${ch.name.substring(0, 2).toUpperCase()}</div>
                    <div style="overflow:hidden;">
                        <div class="ch-title">${ch.name}</div>
                        <div class="ch-sub">● ${ch.group}</div>
                    </div>
                `;
                b.onclick = () => playTv(ch, b);
                list.appendChild(b);
            });
        }

        function playTv(ch, btn) {
            document.querySelectorAll('.ch-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tvTitle').textContent = ch.name;
            document.getElementById('tvGroup').textContent = ch.group;

            const video = document.getElementById('tvVideo');
            if (hls) { hls.destroy(); hls = null; }

            const isApple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);
            if (isApple && video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.load();
                video.play().catch(() => {});
            } else if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            } else {
                video.src = ch.url;
                video.play().catch(() => {});
            }
        }

        function toggleTvPiP() {
            const v = document.getElementById('tvVideo');
            if (v.webkitSetPresentationMode) {
                v.webkitSetPresentationMode(v.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
            } else if (v.requestPictureInPicture) {
                v.requestPictureInPicture();
            }
        }
    </script>
</body>
</html>
