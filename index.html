<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OmniHub — Sinema, Dizi & Canlı TV</title>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmniHub" />

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --bg: #0b0b0f;
            --surface: #14141c;
            --surface-2: #1f1f2b;
            --accent: #e50914;
            --green: #10b981;
            --text: #ffffff;
            --muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-bottom: calc(78px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            user-select: none;
        }

        /* Üst Bar (Ana Ekran / PWA Çentik Uyumlu) */
        header {
            position: sticky;
            top: 0;
            z-index: 90;
            background: rgba(11, 11, 15, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
            padding: max(12px, env(safe-area-inset-top)) 16px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        .logo span {
            background: var(--accent);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 13px;
        }

        .search-wrap {
            flex: 1;
            max-width: 340px;
        }

        .search-wrap input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }

        .search-wrap input:focus {
            border-color: var(--accent);
        }

        /* Alt Menü (4 Sekmeli Mobil & PWA Bar) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 90;
            background: rgba(15, 15, 22, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            padding: 4px 12px;
        }

        .nav-item .ico {
            font-size: 18px;
        }

        .nav-item.active {
            color: var(--accent);
        }

        /* Kategori Çubuğu */
        .chips-row {
            display: flex;
            gap: 8px;
            padding: 12px 16px 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .chips-row::-webkit-scrollbar { display: none; }

        .chip {
            background: var(--surface-2);
            color: var(--muted);
            border: 1px solid var(--border);
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .container {
            padding: 12px 16px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-link {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 12px;
            cursor: pointer;
        }

        /* Kaldığın Yerden Devam Et Yatay Rayı */
        .continue-rail {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 6px;
        }
        .continue-rail::-webkit-scrollbar { display: none; }

        .continue-card {
            min-width: 140px;
            max-width: 140px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
        }

        .continue-card .rm-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            z-index: 4;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 11px;
            cursor: pointer;
        }

        .continue-badge {
            position: absolute;
            bottom: 8px;
            left: 6px;
            right: 6px;
            background: rgba(229, 9, 20, 0.92);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            width: 100%;
        }

        .progress-bar > div {
            height: 100%;
            background: var(--accent);
        }

        /* İçerik Izgarası */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
            gap: 12px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
                gap: 16px;
            }
        }

        .card {
            background: var(--surface);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card-poster {
            position: relative;
            aspect-ratio: 2 / 3;
            background: #1a1a24;
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-rating {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.82);
            color: #fbbf24;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .card-body {
            padding: 8px;
        }

        .card-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-year {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Canlı TV */
        .tv-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        @media (min-width: 900px) {
            .tv-grid {
                grid-template-columns: 1.4fr 1fr;
            }
        }

        .tv-player-card {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-box video {
            width: 100%;
            height: 100%;
        }

        .tv-bar {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .channels-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 8px;
        }

        .ch-item {
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-align: left;
        }

        .ch-item.active {
            border-color: var(--accent);
            background: rgba(229, 9, 20, 0.18);
        }

        .ch-icon {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 11px;
            flex-shrink: 0;
        }

        .ch-title {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ch-sub {
            font-size: 10px;
            color: var(--green);
        }

        /* Oynatıcı Modalı (Mobil Tek El Ergonomili & Dolu Alt Alan) */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: var(--bg);
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: calc(30px + env(safe-area-inset-bottom));
        }

        .modal.open {
            display: flex;
        }

        .modal-header {
            padding: max(12px, env(safe-area-inset-top)) 16px 10px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .close-btn {
            background: var(--surface-2);
            color: #fff;
            border: 1px solid var(--border);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .player-frame-box {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            flex-shrink: 0;
        }

        .player-frame-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Dokunma Kalkanı (Film başladıktan sonra tıklama reklamlarını %100 keser) */
        .touch-shield {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: transparent;
            display: none;
            align-items: flex-end;
            justify-content: flex-end;
            padding: 12px;
        }

        .touch-shield.active {
            display: flex;
        }

        .shield-badge {
            background: rgba(16, 185, 129, 0.92);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 20px;
            border: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            cursor: pointer;
        }

        /* Tek El Mobil Kontrol Barı (Videonun Hemen Altında) */
        .mobile-action-bar {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .mobile-action-bar::-webkit-scrollbar { display: none; }

        .act-btn {
            background: var(--surface-2);
            color: #fff;
            border: 1px solid var(--border);
            padding: 9px 13px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            cursor: pointer;
            flex: 1;
        }

        .act-btn.back {
            background: rgba(255, 255, 255, 0.1);
        }

        .act-btn.shield-on {
            background: rgba(16, 185, 129, 0.22);
            border-color: var(--green);
            color: #34d399;
        }

        .act-btn.fav-on {
            background: rgba(229, 9, 20, 0.22);
            border-color: var(--accent);
            color: #ff6b6b;
        }

        /* Sunucu Seçici */
        .servers-row {
            display: flex;
            gap: 6px;
            padding: 10px 14px;
            background: #101016;
            overflow-x: auto;
            scrollbar-width: none;
            border-bottom: 1px solid var(--border);
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
        }
        .servers-row::-webkit-scrollbar { display: none; }

        .srv-btn {
            background: var(--surface-2);
            color: #d1d5db;
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }

        .srv-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* Zengin Film & Dizi Bilgi Kartı (Alt Boşluğu Doldurur) */
        .modal-body {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .info-poster {
            width: 78px;
            aspect-ratio: 2 / 3;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #1f1f2b;
        }

        .info-details {
            flex: 1;
            min-width: 0;
        }

        .info-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 8px;
            font-size: 11px;
            color: var(--muted);
        }

        .badge {
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 6px;
            color: #e5e7eb;
            font-weight: 600;
        }

        .badge.gold {
            color: #fbbf24;
        }

        .info-desc {
            font-size: 12px;
            line-height: 1.5;
            color: #d1d5db;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info-cast {
            margin-top: 8px;
            font-size: 11px;
            color: var(--muted);
        }

        .ep-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 8px;
            margin-top: 8px;
        }

        .ep-card {
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            padding: 9px 10px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
        }

        .ep-card.active {
            border-color: var(--accent);
            background: rgba(229, 9, 20, 0.2);
        }

        .ep-card .num {
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
        }

        .ep-card .name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showTab('movies')">
            <span>▶</span> OmniHub
        </div>
        <div class="search-wrap">
            <input type="text" id="searchInput" placeholder="Film veya dizi ara..." oninput="onSearch(this.value)" />
        </div>
    </header>

    <!-- 1. FİLMLER SEKMESİ -->
    <div id="view-movies" class="tab-view">
        <!-- Kaldığın Yerden Devam Et Rayı -->
        <div class="container" id="homeContinueBox" style="display: none; padding-bottom: 0;">
            <div class="section-header">
                <div class="section-title">⏯️ Kaldığın Yerden Devam Et</div>
                <button class="clear-link" onclick="showTab('history')">Tümünü Gör →</button>
            </div>
            <div class="continue-rail" id="homeContinueRail"></div>
        </div>

        <div class="chips-row">
            <button class="chip active" onclick="loadMovies('top', '', this)">🔥 Popüler</button>
            <button class="chip" onclick="loadMovies('imdbRating', '', this)">⭐ En İyiler</button>
            <button class="chip" onclick="loadMovies('top', 'Action', this)">💥 Aksiyon</button>
            <button class="chip" onclick="loadMovies('top', 'Sci-Fi', this)">🚀 Bilim Kurgu</button>
            <button class="chip" onclick="loadMovies('top', 'Comedy', this)">😂 Komedi</button>
            <button class="chip" onclick="loadMovies('top', 'Horror', this)">👻 Korku</button>
            <button class="chip" onclick="loadMovies('top', 'Thriller', this)">🔪 Gerilim</button>
        </div>
        <div class="container">
            <div class="grid" id="moviesGrid"></div>
        </div>
    </div>

    <!-- 2. DİZİLER SEKMESİ -->
    <div id="view-series" class="tab-view" style="display: none;">
        <div class="chips-row">
            <button class="chip active" onclick="loadSeries('ALL', this)">🔥 Popüler Diziler</button>
            <button class="chip" onclick="loadSeries('Drama', this)">🎭 Dram</button>
            <button class="chip" onclick="loadSeries('Action', this)">💥 Aksiyon</button>
            <button class="chip" onclick="loadSeries('Science-Fiction', this)">🚀 Bilim Kurgu</button>
            <button class="chip" onclick="loadSeries('Crime', this)">🕵️ Suç</button>
            <button class="chip" onclick="loadSeries('Comedy', this)">😂 Komedi</button>
        </div>
        <div class="container">
            <div class="grid" id="seriesGrid"></div>
        </div>
    </div>

    <!-- 3. İZLEDİKLERİM & LİSTEM SEKMESİ -->
    <div id="view-history" class="tab-view" style="display: none;">
        <div class="container">
            <div class="section-header">
                <div class="section-title">⏯️ Son İzlediklerim (Kaldığın Yerden Devam Et)</div>
                <button class="clear-link" onclick="clearHistory()">Geçmişi Temizle</button>
            </div>
            <div class="grid" id="historyGrid"></div>
        </div>

        <div class="container" style="margin-top: 8px;">
            <div class="section-header">
                <div class="section-title">❤️ İzleme Listem (Favoriler)</div>
            </div>
            <div class="grid" id="favoritesGrid"></div>
        </div>
    </div>

    <!-- 4. CANLI TV SEKMESİ -->
    <div id="view-tv" class="tab-view" style="display: none;">
        <div class="chips-row">
            <button class="chip active" onclick="filterTv('ALL', this)">Tümü</button>
            <button class="chip" onclick="filterTv('Ulusal', this)">📺 Ulusal</button>
            <button class="chip" onclick="filterTv('Haber', this)">📰 Haber</button>
            <button class="chip" onclick="filterTv('Spor', this)">⚽ Spor</button>
            <button class="chip" onclick="filterTv('Müzik', this)">🎵 Müzik & Çocuk</button>
        </div>
        <div class="container">
            <div class="tv-grid">
                <div class="tv-player-card">
                    <div class="video-box">
                        <video id="tvVideo" controls playsinline autoplay></video>
                    </div>
                    <div class="tv-bar">
                        <div>
                            <div style="font-size: 14px; font-weight: 700;" id="tvTitle">Kanal Seçin</div>
                            <div style="font-size: 11px; color: #10b981;" id="tvGroup">Canlı Yayın</div>
                        </div>
                        <button class="chip" onclick="toggleTvPiP()">📺 PiP</button>
                    </div>
                </div>
                <div class="channels-list" id="tvList"></div>
            </div>
        </div>
    </div>

    <!-- ARAMA SONUÇLARI -->
    <div id="view-search" class="tab-view" style="display: none;">
        <div class="container">
            <div class="section-title" id="searchTitle" style="margin-bottom: 12px;">Arama Sonuçları</div>
            <div class="grid" id="searchGrid"></div>
        </div>
    </div>

    <!-- ALT MENÜ -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="movies" onclick="showTab('movies')">
            <span class="ico">🎬</span><span>Filmler</span>
        </button>
        <button class="nav-item" data-tab="series" onclick="showTab('series')">
            <span class="ico">📺</span><span>Diziler</span>
        </button>
        <button class="nav-item" data-tab="history" onclick="showTab('history')">
            <span class="ico">🕒</span><span>İzlediklerim</span>
        </button>
        <button class="nav-item" data-tab="tv" onclick="showTab('tv')">
            <span class="ico">📡</span><span>Canlı TV</span>
        </button>
    </nav>

    <!-- GELİŞMİŞ MOBİL DOSTU OYNATICI MODALI -->
    <div class="modal" id="playerModal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">Başlık</div>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>

        <div class="player-frame-box">
            <iframe id="playerIframe" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" referrerpolicy="origin"></iframe>
            <!-- Dokunma Kalkanı: Aktifken video üzerindeki reklam yönlendirmelerini %100 engeller -->
            <div class="touch-shield" id="touchShield" onclick="unlockShieldTemporarily()">
                <button class="shield-badge">🛡️ Reklam Kilidi Aktif (Kontrol için dokun)</button>
            </div>
        </div>

        <!-- Tek El Başparmak Kontrol Barı (Videonun Hemen Altında) -->
        <div class="mobile-action-bar">
            <button class="act-btn back" onclick="closeModal()">⬅ Geri</button>
            <button class="act-btn" id="shieldBtn" onclick="toggleShield()">🛡️ Reklam Kilidi</button>
            <button class="act-btn" id="favBtn" onclick="toggleFavorite()">🤍 Listem</button>
            <button class="act-btn" id="nextEpBtn" style="display: none;" onclick="playNextEpisode()">⏭ Sonraki Bölüm</button>
        </div>

        <!-- Kaynak Sunucuları -->

        let moviesCache = [...DEFAULT_MOVIES];
        let seriesCache = [];
        let hls = null;
        let shieldLocked = false;
        let shieldTimer = null;

        let state = {
            id: '',
            tmdbId: null,
            tvmazeId: null,
            type: 'movie',
            name: '',
            poster: '',
            releaseInfo: '',
            imdbRating: '',
            season: 1,
            episode: 1,
            server: 0,
            trSubUrl: '',
            episodes: []
        };

        window.addEventListener('DOMContentLoaded', () => {
            renderGrid('moviesGrid', DEFAULT_MOVIES, 'movie');
            renderContinueRail();
            loadMovies('top', '');
            initSeries();
            filterTv('ALL');
        });

        // Oynatıcılardan gelen ilerleme / bölüm mesajlarını dinle (Kaldığın yerden devam et için)
        window.addEventListener('message', (e) => {
            if (!state.id) return;
            const d = e.data;
            if (!d || typeof d !== 'object') return;

            if (d.type === 'TV_STATE' && d.season && d.episode) {
                state.season = Number(d.season);
                state.episode = Number(d.episode);
                saveHistory();
                renderEpisodesUI();
            } else if (d.type === 'MEDIA_DATA' && d.data) {
                saveHistory(d.data.currentTime, d.data.duration);
            }
        });

        // GEÇMİŞ & FAVORİ YÖNETİMİ (localStorage)
        function getHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
        }

        function saveHistory(currentTime = 0, duration = 0) {
            if (!state.id) return;
            const list = getHistory().filter(x => x.id !== state.id);
            const epObj = state.episodes.find(e => e.season === state.season && e.episode === state.episode);
            const pct = duration > 0 ? Math.min(98, Math.max(5, Math.round((currentTime / duration) * 100))) : 25;

            list.unshift({
                id: state.id,
                tmdbId: state.tmdbId,
                tvmazeId: state.tvmazeId,
                type: state.type,
                name: state.name,
                poster: state.poster || `https://images.metahub.space/poster/medium/${state.id}/img`,
                releaseInfo: state.releaseInfo || '',
                imdbRating: state.imdbRating || '',
                season: state.season,
                episode: state.episode,
                epName: epObj?.name || '',
                server: state.server,
                progress: pct,
                updatedAt: Date.now()
            });

            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 30))); } catch {}
            renderContinueRail();
        }

        function removeFromHistory(id, ev) {
            if (ev) ev.stopPropagation();
            const list = getHistory().filter(x => x.id !== id);
            try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch {}
            renderContinueRail();
            renderHistoryTab();
        }

        function clearHistory() {
            try { localStorage.removeItem(HISTORY_KEY); } catch {}
            renderContinueRail();
            renderHistoryTab();
        }

        function getFavorites() {
            try { return JSON.parse(localStorage.getItem(FAVS_KEY) || '[]'); } catch { return []; }
        }

        function toggleFavorite() {
            if (!state.id) return;
            let favs = getFavorites();
            const exists = favs.some(x => x.id === state.id);
            if (exists) {
                favs = favs.filter(x => x.id !== state.id);
            } else {
                favs.unshift({
                    id: state.id,
                    tmdbId: state.tmdbId,
                    tvmazeId: state.tvmazeId,
                    type: state.type,
                    name: state.name,
                    poster: state.poster || `https://images.metahub.space/poster/medium/${state.id}/img`,
                    releaseInfo: state.releaseInfo || '',
                    imdbRating: state.imdbRating || ''
                });
            }
            try { localStorage.setItem(FAVS_KEY, JSON.stringify(favs)); } catch {}
            updateFavButton();
            renderHistoryTab();
        }

        function updateFavButton() {
            const btn = document.getElementById('favBtn');
            const isFav = getFavorites().some(x => x.id === state.id);
            btn.classList.toggle('fav-on', isFav);
            btn.innerHTML = isFav ? '❤️ Listemde' : '🤍 Listem';
        }

        function renderContinueRail() {
            const list = getHistory();
            const box = document.getElementById('homeContinueBox');
            const rail = document.getElementById('homeContinueRail');
            if (!list.length) {
                box.style.display = 'none';
                return;
            }
            box.style.display = 'block';
            rail.innerHTML = '';

            list.slice(0, 12).forEach(item => {
                const badgeText = item.type === 'series' ? `▶ S${item.season}:B${item.episode} Devam Et` : '▶ Filmi Sürdür';
                const card = document.createElement('div');
                card.className = 'continue-card';
                card.onclick = () => openPlayer(item.id, item.type, item.name, item.tvmazeId, item.season, item.episode);
                card.innerHTML = `
                    <button class="rm-btn" onclick="removeFromHistory('${item.id}', event)">✕</button>
                    <div class="card-poster">
                        <img src="${item.poster}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/14141c/666?text=Poster'" />
                        <div class="continue-badge">${badgeText}</div>
                    </div>
                    <div class="progress-bar"><div style="width:${item.progress || 25}%"></div></div>
                    <div class="card-body">
                        <div class="card-name">${item.name}</div>
                        <div class="card-year">${item.type === 'series' ? `${item.season}. Sezon ${item.episode}. Bölüm` : (item.releaseInfo || 'Film')}</div>
                    </div>
                `;
                rail.appendChild(card);
            });
        }

        function renderHistoryTab() {
            const hist = getHistory();
            const favs = getFavorites();
            const hGrid = document.getElementById('historyGrid');
            const fGrid = document.getElementById('favoritesGrid');

            if (!hist.length) {
                hGrid.innerHTML = '<div style="color:var(--muted); font-size:13px; grid-column:1/-1;">Henüz izlenen bir film veya dizi yok.</div>';
            } else {
                renderGrid('historyGrid', hist, 'movie', true);
            }

            if (!favs.length) {
                fGrid.innerHTML = '<div style="color:var(--muted); font-size:13px; grid-column:1/-1;">Listene eklediğin içerik yok. Oynatıcı altındaki "🤍 Listem" butonuyla ekleyebilirsin.</div>';
            } else {
                renderGrid('favoritesGrid', favs, 'movie');
            }
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-view').forEach(v => v.style.display = 'none');
            document.getElementById('view-' + tab).style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            if (tab === 'history') renderHistoryTab();
            window.scrollTo(0, 0);
        }

        async function loadMovies(catalog, genre, btn) {
            if (btn) {
                btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }
            try {
                let url = `${CINEMETA}/catalog/movie/${catalog}.json`;
                if (genre) url = `${CINEMETA}/catalog/movie/${catalog}/genre=${encodeURIComponent(genre)}.json`;
                const res = await fetch(url).then(r => r.json());
                if (res.metas && res.metas.length > 0) {
                    const released = res.metas.filter(m => m.imdbRating && parseFloat(m.imdbRating) > 0);
                    moviesCache = (released.length ? released : res.metas).slice(0, 48);
                    renderGrid('moviesGrid', moviesCache, 'movie');
                }
            } catch {
                renderGrid('moviesGrid', DEFAULT_MOVIES, 'movie');
            }
        }

        async function initSeries() {
            try {
                const shows = await fetch('https://api.tvmaze.com/shows?page=0').then(r => r.json());
                seriesCache = shows
                    .filter(s => s.externals && s.externals.imdb)
                    .sort((a, b) => (b.rating?.average || 0) - (a.rating?.average || 0))
                    .map(s => ({
                        id: s.externals.imdb,
                        tvmazeId: s.id,
                        type: 'series',
                        name: s.name,
                        poster: s.image?.medium || s.image?.original || '',
                        releaseInfo: (s.premiered || '').substring(0, 4),
                        imdbRating: s.rating?.average || '',
                        genres: s.genres || []
                    }));
                renderGrid('seriesGrid', seriesCache.slice(0, 48), 'series');
            } catch {}
        }

        function loadSeries(genre, btn) {
            if (btn) {
                btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }
            const filtered = genre === 'ALL' ? seriesCache.slice(0, 48) : seriesCache.filter(s => s.genres.includes(genre));
            renderGrid('seriesGrid', filtered, 'series');
        }

        let searchTimer = null;
        function onSearch(q) {
            clearTimeout(searchTimer);
            const text = q.trim();
            if (text.length < 2) return;

            searchTimer = setTimeout(async () => {
                showTab('search');
                document.getElementById('searchTitle').textContent = `"${text}" Sonuçları`;
                const items = [];

                try {
                    const [m, s] = await Promise.all([
                        fetch(`${CINEMETA}/catalog/movie/top/search=${encodeURIComponent(text)}.json`).then(r => r.json()),
                        fetch(`${CINEMETA}/catalog/series/top/search=${encodeURIComponent(text)}.json`).then(r => r.json())
                    ]);
                    (m.metas || []).forEach(x => items.push({ ...x, type: 'movie' }));
                    (s.metas || []).forEach(x => items.push({ ...x, type: 'series' }));
                } catch {}

                try {
                    const tv = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(text)}`).then(r => r.json());
                    tv.forEach(e => {
                        const s = e.show;
                        if (s?.externals?.imdb && !items.some(i => i.id === s.externals.imdb)) {
                            items.push({
                                id: s.externals.imdb,
                                tvmazeId: s.id,
                                type: 'series',
                                name: s.name,
                                poster: s.image?.medium || '',
                                releaseInfo: (s.premiered || '').substring(0, 4),
                                imdbRating: s.rating?.average || ''
                            });
                        }
                    });
                } catch {}

                renderGrid('searchGrid', items, 'movie');
            }, 350);
        }

        function renderGrid(id, list, fallbackType, showResumeBadge = false) {
            const box = document.getElementById(id);
            box.innerHTML = '';
            list.forEach(item => {
                const type = item.type || fallbackType;
                const poster = item.poster || `https://images.metahub.space/poster/medium/${item.id}/img`;
                const subText = (showResumeBadge && type === 'series' && item.season)
                    ? `S${item.season}:B${item.episode} • Devam Et`
                    : (item.releaseInfo || '');

                const div = document.createElement('div');
                div.className = 'card';
                div.onclick = () => openPlayer(item.id, type, item.name, item.tvmazeId, item.season, item.episode, item);
                div.innerHTML = `
                    <div class="card-poster">
                        <img src="${poster}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x450/14141c/666?text=Poster'" />
                        ${item.imdbRating ? `<span class="card-rating">⭐ ${item.imdbRating}</span>` : ''}
                    </div>
                    <div class="card-body">
                        <div class="card-name">${item.name}</div>
                        <div class="card-year">${subText}</div>
                    </div>
                `;
                box.appendChild(div);
            });
        }

        // DOKUNMA KALKANI (Film başladıktan sonra tıklama reklamlarını %100 engeller)
        function toggleShield(forceState) {
            shieldLocked = typeof forceState === 'boolean' ? forceState : !shieldLocked;
            clearTimeout(shieldTimer);
            const shield = document.getElementById('touchShield');
            const btn = document.getElementById('shieldBtn');
            shield.classList.toggle('active', shieldLocked);
            btn.classList.toggle('shield-on', shieldLocked);
            btn.innerHTML = shieldLocked ? '🔒 Kilit Açık' : '🛡️ Reklam Kilidi';
        }

        function unlockShieldTemporarily() {
            // Kullanıcı videoyu durdurmak/tam ekran yapmak istediğinde 6 saniyeliğine kilidi açıp tekrar koruma sağlar
            const shield = document.getElementById('touchShield');
            shield.classList.remove('active');
            clearTimeout(shieldTimer);
            shieldTimer = setTimeout(() => {
                if (shieldLocked) shield.classList.add('active');
            }, 6000);
        }

        // OYNATICI AÇMA (Kaldığın Bölümü Otomatik Hatırlar)
        async function openPlayer(id, type, name, tvmazeId, forcedSeason, forcedEpisode, rawItem) {
            const saved = getHistory().find(x => x.id === id);
            const initSeason = forcedSeason || saved?.season || 1;
            const initEpisode = forcedEpisode || saved?.episode || 1;
            const initServer = saved?.server ?? 0;

            state = {
                id,
                tmdbId: saved?.tmdbId || null,
                tvmazeId: tvmazeId || saved?.tvmazeId || null,
                type,
                name,
                poster: rawItem?.poster || saved?.poster || `https://images.metahub.space/poster/medium/${id}/img`,
                releaseInfo: rawItem?.releaseInfo || saved?.releaseInfo || '',
                imdbRating: rawItem?.imdbRating || saved?.imdbRating || '',
                season: initSeason,
                episode: initEpisode,
                server: initServer,
                trSubUrl: '',
                episodes: []
            };

            toggleShield(false);
            document.getElementById('playerModal').classList.add('open');
            document.getElementById('playerModal').scrollTop = 0;
            document.getElementById('modalTitle').textContent = type === 'series' ? `${name} (S${initSeason}:B${initEpisode})` : name;
            document.querySelectorAll('.srv-btn').forEach((b, i) => b.classList.toggle('active', i === initServer));

            // Detay kartı ilk yükleme
            document.getElementById('infoPoster').src = state.poster;
            document.getElementById('infoName').textContent = name;
            document.getElementById('infoMeta').innerHTML = `
                ${state.releaseInfo ? `<span class="badge">${state.releaseInfo}</span>` : ''}
                ${state.imdbRating ? `<span class="badge gold">⭐ ${state.imdbRating}</span>` : ''}
                <span class="badge">🇹🇷 Türkçe Altyazı</span>
            `;
            document.getElementById('infoDesc').textContent = 'İçerik bilgileri yükleniyor...';
            document.getElementById('infoCast').textContent = '';

            updateFavButton();

            if (type === 'series') {
                document.getElementById('episodesBox').style.display = 'block';
                document.getElementById('nextEpBtn').style.display = 'flex';
                fetchEpisodes(id, state.tvmazeId);
            } else {
                document.getElementById('episodesBox').style.display = 'none';
                document.getElementById('nextEpBtn').style.display = 'none';
            }

            // Alt boşluğu dolduran benzer içerikler
            const pool = (type === 'series' ? seriesCache : moviesCache).filter(x => x.id !== id).slice(0, 6);
            renderGrid('relatedGrid', pool.length ? pool : DEFAULT_MOVIES.slice(0, 6), type);

            saveHistory();
            await Promise.all([fetchMetaInfo(), fetchTrSub()]);
            refreshIframe();
        }

        async function fetchMetaInfo() {
            try {
                const res = await fetch(`${CINEMETA}/meta/${state.type}/${state.id}.json`).then(r => r.json());
                const m = res?.meta;
                if (!m) return;

                if (m.moviedb_id) state.tmdbId = m.moviedb_id;
                if (m.poster) {
                    state.poster = m.poster;
                    document.getElementById('infoPoster').src = m.poster;
                }
                if (m.year || m.releaseInfo) state.releaseInfo = m.year || m.releaseInfo;
                if (m.imdbRating) state.imdbRating = m.imdbRating;

                const genres = (m.genre || m.genres || []).slice(0, 3).map(g => `<span class="badge">${g}</span>`).join('');
                document.getElementById('infoMeta').innerHTML = `
                    ${state.releaseInfo ? `<span class="badge">${state.releaseInfo}</span>` : ''}
                    ${state.imdbRating ? `<span class="badge gold">⭐ ${state.imdbRating}</span>` : ''}
                    ${m.runtime ? `<span class="badge">⏱ ${m.runtime}</span>` : ''}
                    ${genres}
                `;
                document.getElementById('infoDesc').textContent = m.description || 'Açıklama bulunmuyor.';
                if (m.cast && m.cast.length) {
                    document.getElementById('infoCast').textContent = '🎭 Oyuncular: ' + m.cast.slice(0, 5).join(', ');
                }

                if (state.type === 'series' && (!state.episodes || state.episodes.length === 0) && m.videos?.length) {
                    state.episodes = m.videos
                        .filter(v => v.season > 0)
                        .map(v => ({ season: v.season, episode: v.episode || v.number, name: v.name || `${v.episode || v.number}. Bölüm` }));
                    renderEpisodesUI();
                }
                saveHistory();
            } catch {}
        }

        async function fetchTrSub() {
            state.trSubUrl = '';
            try {
                const q = state.type === 'series' ? `${state.id}:${state.season}:${state.episode}` : state.id;
                const res = await fetch(`${OPENSUBS}/subtitles/${state.type}/${q}.json`).then(r => r.json());
                const tr = (res.subtitles || []).find(s => s.lang === 'tur' || s.lang === 'tr');
                if (tr && tr.url) state.trSubUrl = tr.url;
            } catch {}
        }

        function refreshIframe() {
            const { id, tmdbId, type, name, season, episode, server, trSubUrl } = state;
            const subParam = trSubUrl ? `&sub_file=${encodeURIComponent(trSubUrl)}&sub_label=Turkce` : '';

            if (type === 'series') {
                document.getElementById('modalTitle').textContent = `${name} (S${season}:B${episode})`;
            }

            let url = '';
            if (type === 'movie') {
                if (server === 0) url = `https://vidsrc.me/embed/movie?imdb=${id}&ds_lang=tr`;
                else if (server === 1) url = `https://vidlink.pro/movie/${tmdbId || id}?autoplay=true${subParam}`;
                else if (server === 2) url = `https://vidsrc.pm/embed/movie?imdb=${id}&ds_lang=tr`;
                else if (server === 3) url = `https://autoembed.co/movie/imdb/${id}`;
            } else {
                if (server === 0) url = `https://vidsrc.me/embed/tv?imdb=${id}&season=${season}&episode=${episode}&ds_lang=tr`;
                else if (server === 1) url = `https://vidlink.pro/tv/${tmdbId || id}/${season}/${episode}?autoplay=true${subParam}`;
                else if (server === 2) url = `https://vidsrc.pm/embed/tv?imdb=${id}&season=${season}&episode=${episode}&ds_lang=tr`;
                else if (server === 3) url = `https://autoembed.co/tv/imdb/${id}-${season}-${episode}`;
            }

            document.getElementById('playerIframe').src = url;
            saveHistory();
        }

        function setServer(idx, btn) {
            state.server = idx;
            document.querySelectorAll('.srv-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            refreshIframe();
        }

        async function playNextEpisode() {
            if (state.type !== 'series' || !state.episodes.length) return;
            const curSeasonEps = state.episodes.filter(e => e.season === state.season);
            const nextInSeason = curSeasonEps.find(e => e.episode === state.episode + 1);
            if (nextInSeason) {
                state.episode += 1;
            } else {
                const nextSeason = state.episodes.find(e => e.season === state.season + 1);
                if (nextSeason) {
                    state.season += 1;
                    state.episode = 1;
                }
            }
            renderEpisodesUI();
            await fetchTrSub();
            refreshIframe();
        }

        async function fetchEpisodes(imdbId, tvmazeId) {
            const sRow = document.getElementById('seasonsRow');
            const eList = document.getElementById('episodesList');
            sRow.innerHTML = '';
            eList.innerHTML = '';

            try {
                let showId = tvmazeId;
                if (!showId) {
                    const info = await fetch(`https://api.tvmaze.com/lookup/shows?imdb=${imdbId}`).then(r => r.json());
                    showId = info.id;
                }
                if (showId) {
                    const eps = await fetch(`https://api.tvmaze.com/shows/${showId}/episodes`).then(r => r.json());
                    if (eps && eps.length) {
                        state.episodes = eps.map(e => ({ season: e.season, episode: e.number, name: e.name }));
                        renderEpisodesUI();
                    }
                }
            } catch {}
        }

        function renderEpisodesUI() {
            const sRow = document.getElementById('seasonsRow');
            const eList = document.getElementById('episodesList');
            sRow.innerHTML = '';
            eList.innerHTML = '';

            const seasons = [...new Set(state.episodes.map(e => e.season))].filter(Boolean);
            seasons.forEach(s => {
                const b = document.createElement('button');
                b.className = 'chip' + (s === state.season ? ' active' : '');
                b.textContent = `${s}. Sezon`;
                b.onclick = () => {
                    state.season = s;
                    renderEpisodesUI();
                };
                sRow.appendChild(b);
            });

            state.episodes.filter(e => e.season === state.season).forEach(ep => {
                const b = document.createElement('button');
                b.className = 'ep-card' + (ep.episode === state.episode ? ' active' : '');
                b.innerHTML = `<div class="num">${ep.episode}. Bölüm</div><div class="name">${ep.name || ''}</div>`;
                b.onclick = async () => {
                    state.episode = ep.episode;
                    renderEpisodesUI();
                    await fetchTrSub();
                    refreshIframe();
                };
                eList.appendChild(b);
            });
        }

        function closeModal() {
            toggleShield(false);
            document.getElementById('playerModal').classList.remove('open');
            document.getElementById('playerIframe').src = 'about:blank';
        }

        // Canlı TV
        function filterTv(cat, btn) {
            if (btn) {
                btn.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
            }
            const list = document.getElementById('tvList');
            list.innerHTML = '';
            const items = cat === 'ALL' ? TV_CHANNELS : TV_CHANNELS.filter(c => c.group === cat);

            items.forEach(ch => {
                const b = document.createElement('button');
                b.className = 'ch-item';
                b.innerHTML = `
                    <div class="ch-icon">${ch.name.substring(0, 2).toUpperCase()}</div>
                    <div style="overflow:hidden;">
                        <div class="ch-title">${ch.name}</div>
                        <div class="ch-sub">● ${ch.group}</div>
                    </div>
                `;
                b.onclick = () => playTv(ch, b);
                list.appendChild(b);
            });
        }

        function playTv(ch, btn) {
            document.querySelectorAll('.ch-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tvTitle').textContent = ch.name;
            document.getElementById('tvGroup').textContent = ch.group;

            const video = document.getElementById('tvVideo');
            if (hls) { hls.destroy(); hls = null; }

            const isApple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent);
            if (isApple && video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.load();
                video.play().catch(() => {});
            } else if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(ch.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
            } else {
                video.src = ch.url;
                video.play().catch(() => {});
            }
        }

        function toggleTvPiP() {
            const v = document.getElementById('tvVideo');
            if (v.webkitSetPresentationMode) {
                v.webkitSetPresentationMode(v.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
            } else if (v.requestPictureInPicture) {
                v.requestPictureInPicture();
            }
        }
    </script>
</body>
